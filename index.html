<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Cache-Control" content="no-cache">

        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">

        <link rel="apple-touch-icon" href="logo.png">
        <link rel="icon" href="logo.png">

        <title>WebGL Fluid Simulation</title>
        <meta name="description" content="A WebGL fluid simulation that works in mobile browsers.">

        <meta property="og:type" content="website">
        <meta property="og:title" content="Webgl Fluid Simulation">
        <meta property="og:description" content="A WebGL fluid simulation that works in mobile browsers.">
        <meta property="og:url" content="https://paveldogreat.github.io/WebGL-Fluid-Simulation/">
        <meta property="og:image" content="https://paveldogreat.github.io/WebGL-Fluid-Simulation/logo.png">

        <script type="text/javascript" src="dat.gui.min.js"></script>
        <script src="hands.js"></script>
        <style>
            @font-face {
                font-family: 'iconfont';
                src: url('iconfont.ttf') format('truetype');
            }

            * {
                user-select: none;
            }

            html, body {
                overflow: hidden;
                background-color: #000;
            }

            body {
                margin: 0;
                position: fixed;
                width: 100%;
                height: 100%;
            }

            canvas {
                width: 100%;
                height: 100%;
            }

            .dg {
                opacity: 0.9;
            }

            .dg .property-name {
                overflow: visible;
            }

            .bigFont {
                font-size: 150%;
                color: #8C8C8C;
            }

            .cr.function.appBigFont {
                font-size: 150%;
                line-height: 27px;
                color: #A5F8D3;
                background-color: #023C40;
            }

            .cr.function.appBigFont .property-name {
                float: none;
            }

            .cr.function.appBigFont .icon {
                position: sticky;
                bottom: 27px;
            }

            .icon {
                font-family: 'iconfont';
                font-size: 130%;
                float: right;
            }

            .twitter:before {
                content: 'a';
            }

            .github:before {
                content: 'b';
            }

            .app:before {
                content: 'c';
            }

            .discord:before {
                content: 'd';
            }

            .promo {
                display: none;
                /* display: table; */
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
                overflow: auto;
                color: lightblue;
                background-color: rgba(0,0,0,0.4);
                animation: promo-appear-animation 0.35s ease-out;
            }

            .promo-middle {
                display: table-cell;
                vertical-align: middle;
            }

            .promo-content {
                width: 80vw;
                height: 80vh;
                max-width: 80vh;
                max-height: 80vw;
                margin: auto;
                padding: 0;
                font-size: 2.8vmax;
                font-family: Futura, "Trebuchet MS", Arial, sans-serif;
                text-align: center;
                background-image: url("promo_back.png");
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;
                border-radius: 15px;
                box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
            }

            .promo-header {
                height: 10%;
                padding: 2px 16px;
            }

            .promo-close {
                width: 10%;
                height: 100%;
                text-align: left;
                float: left;
                font-size: 1.3em;
                /* transition: 0.2s; */
            }

            .promo-close:hover {
                /* transform: scale(1.25); */
                cursor: pointer;
            }

            .promo-body {
                padding: 8px 16px 16px 16px;
                margin: auto;
            }

            .promo-body p {
                margin-top: 0;
                mix-blend-mode: color-dodge;
            }

            .link {
                width: 100%;
                display: inline-block;
            }

            .link img {
                width: 100%;
            }

            #camera-status {
              position: fixed;
              top: 10px;
              left: 50%;
              transform: translateX(-50%);
              padding: 6px 16px;
              border-radius: 12px;
              font-family: sans-serif;
              font-size: 13px;
              z-index: 10;
              display: none;
              pointer-events: none;
              transition: opacity 0.3s;
          }
          #camera-status.loading { background: rgba(255,200,0,0.8); color: #000; }
          #camera-status.active { background: rgba(0,200,0,0.7); color: #fff; }
          #camera-status.available { background: rgba(0,200,0,0.85); color: #fff; }
          #camera-status.error { background: rgba(255,0,0,0.7); color: #fff; }
          #camera-dot {
              position: fixed;
              top: 14px;
              right: 14px;
              width: 12px;
              height: 12px;
              border-radius: 50%;
              z-index: 20;
              pointer-events: none;
              transition: background-color 0.5s;
          }
          #camera-dot.available { background-color: #4f4; }
          #camera-dot.unavailable { background-color: #f44; }
          #camera-dot.checking { background-color: #fa0; }
          #camera-dot.inactive { background-color: #888; }

          @keyframes promo-appear-animation {
                0% {
                    transform: scale(2.0);
                    opacity: 0;
                }
                100% {
                    transform: scale(1.0);
                    opacity: 1;
                }
            }

            #sidebar {
                position: fixed;
                left: 0;
                top: 0;
                z-index: 50;
                display: flex;
                flex-direction: column;
                max-height: calc(100vh - 160px);
            }

            #sidebar-content {
                width: 280px;
                background: rgba(0, 0, 0, 0.75);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-bottom: none;
                border-radius: 0 10px 0 0;
                padding: 16px 14px 16px 18px;
                color: #ccc;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                font-size: 14px;
                line-height: 1.7;
                overflow-y: auto;
                overflow-x: hidden;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                max-height: 400px;
                transition: max-height 0.3s ease, padding-top 0.3s ease, padding-bottom 0.3s ease;
            }

            #sidebar.collapsed #sidebar-content {
                max-height: 0;
                padding-top: 0;
                padding-bottom: 0;
                border: none;
            }

            #sidebar-content h3 {
                margin: 0 0 12px 0;
                font-size: 16px;
                color: #A5F8D3;
                font-weight: 600;
                letter-spacing: 0.5px;
            }

            #sidebar-content p {
                margin: 0 0 8px 0;
            }

            #sidebar-toggle {
                width: 280px;
                height: 26px;
                background: rgba(0, 0, 0, 0.75);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-top: none;
                border-radius: 0 0 10px 0;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                color: #999;
                font-size: 11px;
                transition: color 0.2s, background 0.2s, border-radius 0.3s ease;
                user-select: none;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }

            #sidebar.collapsed #sidebar-toggle {
                border-radius: 0 10px 10px 0;
                border-top: 1px solid rgba(255, 255, 255, 0.12);
            }

            #sidebar-toggle:hover {
                color: #A5F8D3;
                background: rgba(0, 0, 0, 0.85);
            }

        </style>
    </head>
    <body>
        <div id="camera-status"></div>
        <div id="camera-dot" class="inactive" title="Camera not checked"></div>
        <video id="webcam" autoplay playsinline muted style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;"></video>
        <div id="webcam-preview" style="position:fixed; bottom:10px; right:10px; width:160px; border:2px solid rgba(255,255,255,0.5); border-radius:8px; overflow:hidden; z-index:10; user-select:none;">
            <div id="preview-header" style="height:20px; background:rgba(0,0,0,0.6); cursor:move; display:flex; align-items:center; justify-content:space-between; padding:0 4px;">
                <span style="color:#aaa; font-size:10px;">Camera</span>
                <button id="preview-collapse-btn" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:12px; padding:0 4px; line-height:1;" title="折叠预览">−</button>
            </div>
            <div id="preview-body">
                <video id="webcam-preview-video" autoplay playsinline muted style="width:100%; height:120px; object-fit:cover; transform:scaleX(-1); display:block;"></video>
            </div>
        </div>
        <div id="sidebar">
            <div id="sidebar-content">
                <h3>使用说明</h3>
                <p>1. 没有摄像头的状态下，可用鼠标左键拖拽。</p>
                <p>2. 有摄像头的情况下，可在右侧卷栏中打开Camera -- enable camera。程序识别相机后可通过手势来控制流体模拟。</p>
            </div>
            <div id="sidebar-toggle" title="收起">▲</div>
        </div>
        <canvas></canvas>
        <div id="debug-panel" style="display:none;position:fixed;top:50px;left:10px;background:rgba(0,0,0,0.85);color:#0f0;font:12px monospace;padding:10px;border-radius:6px;z-index:200;line-height:1.6;min-width:260px;"></div>

        <!-- Mother of God, pls forgive me -->
        <div class="promo">
            <div class="promo-middle">
                <div class="promo-content">
                    <div class="promo-header">
                        <span class="promo-close">&times;</span>
                    </div>
                    <div class="promo-body">
                        <p>Try Fluid Simulation app!</p>
                        <div class="links-container">
                            <a class="link" id="apple_link" target="_blank">
                                <img class="link-img" alt="Download on the App Store" src="app_badge.png"/>
                            </a>
                            <a class="link" id="google_link" target="_blank">
                                <img class="link-img" alt="Get it on Google Play" src="gp_badge.png"/>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="js/fluid-core.js"></script>
        <script src="js/fluid-solver.js"></script>
        <script src="js/fluid-render.js"></script>
        <script src="js/fluid-input.js"></script>
        <script src="js/fluid-handtracking.js"></script>
        <script src="js/fluid-gui.js"></script>
        <script src="js/fluid-main.js"></script>
    </body>
</html>
